<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DFL Rewards</title>
<meta name="theme-color" content="#0F1F45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DFL Rewards">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F1F45; --ink:#16213F; --mute:#8590AE; --mid:#5B6584;
  --bg:#F5F6FB; --card:#fff; --line:#E7EAF4; --seg:#E8EBF5;
  --red:#DC4259; --purple:#7B4FD3; --blue:#3F6BD6; --amber:#BF7A00; --teal:#2A8090; --green:#2E9E63;
  --sv:#8C97A6; --sv-bd:#B3BBC7; --sv-bg:#F3F5F8; --sv-tx:#4B5565;
  --gd:#C48A0A; --gd-bd:#E3C170; --gd-bg:#FDF6E3; --gd-tx:#7A5604;
  --pt:#9C2748; --pt-bd:#E3A3B4; --pt-bg:#FBE9EE; --pt-tx:#9C2748;
  --shadow:0 1px 2px rgba(20,30,70,.05),0 6px 18px rgba(20,30,70,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--navy)}
body{font-family:'Open Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh}
body.lock{overflow:hidden}
h1,h2,h3,.m{font-family:'Montserrat',sans-serif}
svg{display:block}
button{font-family:inherit}

/* top bar */
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
.logo{display:flex;align-items:center;min-height:26px}
.logo img{height:26px;width:auto;max-width:140px;object-fit:contain;display:block}
.wm{display:none;font-family:'Montserrat',sans-serif;font-style:italic;font-weight:800;
  font-size:18px;letter-spacing:-.02em;line-height:1;color:#fff}
.wm small{display:block;font-size:7.5px;font-weight:700;letter-spacing:.2em;font-style:normal;color:#8FA6D6;margin-top:3px}
.bar .t{font-family:'Montserrat',sans-serif;font-weight:600;font-size:15px;flex:1}
.bar button{background:none;border:1px solid rgba(255,255,255,.25);color:#C9D4F0;border-radius:9px;
  font-family:'Montserrat',sans-serif;font-weight:600;font-size:12px;padding:7px 12px;cursor:pointer}

.wrap{max-width:640px;margin:0 auto;padding:26px 16px calc(48px + env(safe-area-inset-bottom))}

/* welcome */
.hello{margin-bottom:4px}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:'Montserrat',sans-serif;font-weight:700;
  font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
.eyebrow:before{content:"";width:22px;height:3px;border-radius:2px;background:var(--blue)}
.hello h1{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin-top:10px;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.c2{font-family:'Montserrat',sans-serif;font-weight:600;font-size:12px;color:var(--mid);background:#fff;
  border:1px solid var(--line);padding:6px 12px;border-radius:20px}
.c2.b{background:#ECF1FC;border-color:#9DB6EC;color:#2A4FAE;font-weight:700}


.eyerow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sp{display:inline-flex;align-items:center;gap:6px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:11.5px;
  letter-spacing:.1em;text-transform:uppercase;padding:7px 13px;border-radius:20px;color:#fff;white-space:nowrap}
.sp-0{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.sp{font-size:10.5px;letter-spacing:.08em;padding:7px 13px}
.sp-1{background:linear-gradient(135deg,#F4F6F9,#BCC4CF);color:#2F3846;border:1px solid #AEB7C4}
.sp-2{background:linear-gradient(135deg,#F5D67F,#D9A21E);color:#4A3200;}
.sp-3{color:#fff}
.sp-3{background:linear-gradient(135deg,#7C2142,#A63A5E)}

/* rewards card */
.rw{position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:22px 20px 18px;margin-bottom:14px;
  background:linear-gradient(140deg,#0F1F45 0%,#1F3C8F 55%,#3F6BD6 100%);box-shadow:0 10px 28px rgba(31,60,143,.28)}
.rw:before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,0) 70%)}
.rw>*{position:relative}
.rwt{display:flex;justify-content:space-between;align-items:center;font-family:'Montserrat',sans-serif;
  font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.rwt span:first-child{opacity:.85}.rwt span:last-child{opacity:.6}
.rwl{font-size:14px;margin-top:22px;opacity:.9}
.rwn{font-family:'Montserrat',sans-serif;font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1.05;margin-top:4px}
.rwc{font-size:13px;opacity:.92;margin-top:10px;line-height:1.5}
.rwch{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.rwch span{font-family:'Montserrat',sans-serif;font-weight:700;font-size:11px;background:rgba(255,255,255,.16);
  padding:6px 11px;border-radius:20px}
.rwf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25)}
.rwf .cap{opacity:.7}
.rwf .v{font-family:'Montserrat',sans-serif;font-weight:800;font-size:17px;margin-top:3px}


.rwl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rpill{font-family:'Montserrat',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:.04em;background:rgba(255,255,255,.2);
  padding:6px 12px;border-radius:20px;white-space:nowrap}
.pb{margin-top:20px}
.pbt{position:relative;height:14px;border-radius:8px;background:rgba(255,255,255,.2);overflow:hidden}
.pbc{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden;transition:width 1s cubic-bezier(.22,1,.36,1);z-index:1}
.pbg{position:absolute;left:0;top:0;bottom:0;width:300px;
  background:linear-gradient(to right,#DC4259 0%,#DC4259 14%,#E8A72C 48%,#2E9E63 88%,#2E9E63 100%)}
.pbm{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;opacity:.95;z-index:2}
.pbl{display:flex;justify-content:space-between;font-size:12.5px;margin-top:9px;opacity:.95}
.pbl b{font-family:'Montserrat',sans-serif;font-weight:700}
.rwch span{display:inline-flex;align-items:center;gap:7px}
.rwch i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* flat ladder (no outer box) */
.lad{margin:22px 2px 18px}
.lad h2{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.lad .sub{color:var(--mute);font-size:13px;margin-top:3px;line-height:1.45}

/* segmented tabs */
.stick{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0 16px}
.seg{display:flex;background:var(--seg);border-radius:16px;padding:5px;gap:4px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:none;
  background:none;border-radius:12px;padding:12px 8px;font-family:'Montserrat',sans-serif;
  font-weight:700;font-size:14px;color:var(--mid);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,30,70,.12)}
.pane{display:none}.pane.on{display:block}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{border-radius:20px;padding:18px 18px 16px;color:#fff;text-align:left;border:none;width:100%;display:block}
.tile.full{grid-column:1/-1}
.tile.tap{cursor:pointer}
.tile.tap:active{filter:brightness(.94)}
.chip{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start}
.tile .go{display:flex;align-items:center;gap:4px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:11.5px;
  background:rgba(255,255,255,.2);padding:7px 11px;border-radius:20px}
.tile .lb{font-family:'Montserrat',sans-serif;font-weight:600;font-size:15px}
.tile .nm{font-family:'Montserrat',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.tile.full .nm{font-size:38px}
.tile .cp{font-size:12.5px;opacity:.94;margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.28);line-height:1.4}
.t-blue{background:var(--blue)}.t-teal{background:var(--teal)}.t-amber{background:var(--amber)}
.t-red{background:var(--red)}.t-purple{background:var(--purple)}.t-green{background:var(--green)}

/* section card */
.sec{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border-left:5px solid var(--accent,var(--blue));
  padding:20px 18px;margin-bottom:16px}
.sec h2{font-size:18px;font-weight:700;color:var(--accent,var(--blue))}
.sec .sub{color:var(--mute);font-size:13px;margin-top:3px;line-height:1.45}

/* ladder */
.climb{display:flex;gap:16px;margin-top:20px}
.track{position:relative;width:13px;flex:0 0 13px;border-radius:7px;background:#E7EBF3;overflow:hidden;min-height:120px}
.clip{position:absolute;bottom:0;left:0;width:100%;height:0;overflow:hidden;
  transition:height .95s cubic-bezier(.22,1,.36,1);z-index:2}
.bar-fill{position:absolute;bottom:0;left:0;width:100%;
  background:linear-gradient(to top,#DC4259 0%,#DC4259 14%,#E8A72C 48%,#2E9E63 88%,#2E9E63 100%)}
.mark{position:absolute;left:0;width:100%;height:2px;background:#fff;z-index:3;opacity:.9}
.rungs{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.rung{border:1.5px solid var(--line);border-radius:16px;padding:14px 15px 13px;background:#fff}
.rh{display:flex;align-items:center;gap:8px}
.rung .lvl{font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:800;display:flex;align-items:center;gap:7px;flex:1}
.rung .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.rate{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;
  background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.06)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.cap{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.7}
.val{font-family:'Montserrat',sans-serif;font-weight:800;font-size:15.5px;margin-top:3px;letter-spacing:-.01em;white-space:nowrap}
.rung .gap{font-size:12.5px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,.08);line-height:1.4}
.rung .gap b{font-weight:700}
.rung.t1{border-color:var(--sv-bd);background:var(--sv-bg)}.rung.t1 .lvl,.rung.t1 .val{color:var(--sv-tx)}.rung.t1 .dot{background:var(--sv)}
.rung.t2{border-color:var(--gd-bd);background:var(--gd-bg)}.rung.t2 .lvl,.rung.t2 .val{color:var(--gd-tx)}.rung.t2 .dot{background:var(--gd)}
.rung.t3{border-color:var(--pt-bd);background:var(--pt-bg)}.rung.t3 .lvl,.rung.t3 .val{color:var(--pt-tx)}.rung.t3 .dot{background:var(--pt)}
.rung.t1 .rate{color:var(--sv-tx)}.rung.t2 .rate{color:var(--gd-tx)}.rung.t3 .rate{color:var(--pt-tx)}
.rung.earned,.rung.earned .lvl,.rung.earned .val,.rung.earned .cap,.rung.earned .gap{color:#fff}
.rung.earned .gap{border-top-color:rgba(255,255,255,.28)}
.rung.earned .dot{background:rgba(255,255,255,.9)}
.rung.earned .rate{background:rgba(255,255,255,.22);color:#fff;border-color:transparent}
.rung.t1.earned{background:var(--sv);border-color:var(--sv)}
.rung.t2.earned{background:var(--gd);border-color:var(--gd)}
.rung.t3.earned{background:var(--pt);border-color:var(--pt)}
.rung.next{border-width:2.5px}
.tick{font-size:9.5px;font-weight:700;letter-spacing:.1em;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.24)}
.note{font-size:12px;color:var(--mute);line-height:1.65;padding:0 4px}

/* standings */
.rows{margin-top:6px}
.grp{display:flex;align-items:center;gap:10px;margin:16px 0 4px;font-family:'Montserrat',sans-serif;
  font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.grp hr{flex:1;border:none;border-top:1.5px dashed currentColor;opacity:.4}
.g1{color:var(--sv-tx)}.g2{color:var(--gd-tx)}.g3{color:var(--pt-tx)}.g0{color:var(--mute)}
.r{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:none}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;
  justify-content:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;flex:0 0 38px}
.r.you .av{background:var(--blue);box-shadow:0 0 0 3px #D8E2FA}
.r.you{background:linear-gradient(90deg,#F0F4FD,#fff);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:12px}
.r .nm{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .nm small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.r .pc{font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px}
.pill{font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 9px;border-radius:20px;color:#fff}
.pill.p1{background:var(--sv)}.pill.p2{background:var(--gd)}.pill.p3{background:var(--pt)}

/* category sheet */
.sheet{position:fixed;inset:0;background:rgba(15,31,69,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet.on{display:flex}
.panel{background:#fff;width:100%;max-width:640px;border-radius:26px 26px 0 0;max-height:86vh;overflow:auto;
  padding:10px 20px calc(26px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ph h3{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.ph p{color:var(--mute);font-size:13px;margin-top:3px}
.x{background:var(--bg);border:none;width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;color:var(--mid);cursor:pointer;flex:0 0 36px}
.cat{padding:13px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border-bottom:none}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cn{font-weight:700;font-size:14px}
.ca{font-family:'Montserrat',sans-serif;font-weight:800;font-size:14.5px}
.cb{height:8px;border-radius:5px;background:#E7EBF3;margin-top:8px;overflow:hidden}
.cb i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#3F6BD6,#6C93EC)}
.cs{font-size:11.5px;color:var(--mute);margin-top:5px}
.cat.neg .ca{color:var(--red)}
.empty{color:var(--mid);font-size:14px;padding:22px 0}

/* install */
.install{display:none;background:var(--navy);color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:16px;
  font-size:13px;line-height:1.5;align-items:center;gap:12px}
.install.on{display:flex}.install .t{flex:1}
.install b{font-family:'Montserrat',sans-serif;font-weight:700}
.install button{background:var(--blue);color:#fff;border:none;border-radius:10px;font-family:'Montserrat',sans-serif;
  font-weight:700;font-size:12.5px;padding:10px 15px;cursor:pointer}
.install .xx{background:none;color:#8FA6D6;font-size:22px;padding:2px 6px;line-height:1}

/* gate */
.gate{min-height:100vh;background:var(--navy);padding:calc(40px + env(safe-area-inset-top)) 22px 40px;
  display:flex;flex-direction:column;align-items:center}
.gate .logo{margin-bottom:28px}
.gate .logo img{height:38px;max-width:180px}
.gate .wm{font-size:24px}
.gc{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.gc h1{font-size:22px;font-weight:700;color:var(--ink)}
.gc p{color:var(--mute);font-size:14px;margin:6px 0 22px}
.pwrow{position:relative}
.pwrow input{width:100%;font-family:'Montserrat',sans-serif;font-size:17px;font-weight:700;letter-spacing:.14em;
  text-align:center;padding:15px 66px 15px 16px;border-radius:14px;border:2px solid var(--line);background:#F8F9FD;color:var(--ink)}
.pwrow input:focus{outline:none;border-color:var(--blue);background:#fff}
.pwrow input::placeholder{letter-spacing:.02em;font-weight:500;color:var(--mute);font-size:15px}
.show{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--blue);
  font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;padding:10px;cursor:pointer}
.btn{width:100%;margin-top:14px;font-family:'Montserrat',sans-serif;font-size:15px;font-weight:700;color:#fff;
  background:var(--blue);border:none;border-radius:14px;padding:15px;cursor:pointer}
.btn:active{background:#2F57B8}
.err{background:#FDECEE;color:#A62C3E;font-size:13px;padding:11px 14px;border-radius:12px;margin-top:14px}
.stamp{font-size:11.5px;color:var(--mute);text-align:center;margin-top:6px}
@media (max-width:360px){.val{font-size:14px}.hello h1{font-size:26px}.rwn{font-size:36px}}
@media (prefers-reduced-motion:reduce){.clip{transition:none}.panel{animation:none}}

.rw{background:linear-gradient(140deg,#0F1F45 0%,#1F3C8F 55%,#3F6BD6 100%);box-shadow:0 12px 30px rgba(31,60,143,.30);padding:20px 18px 18px;margin-top:2px}
.rwtop{display:flex;justify-content:space-between;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8FA6D6}
.rwrow{display:flex;align-items:center;gap:16px;margin-top:16px}
.ring{position:relative;width:112px;height:112px;flex:0 0 112px}
.ring svg{display:block}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .rn{font-family:'Montserrat',sans-serif;font-weight:800;font-size:25px;line-height:1}
.ring .rs{font-size:11px;color:#8FA6D6;margin-top:4px}
.rarc{transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1)}
.rwx{min-width:0}
.rwx .l{font-size:12.5px;color:#AFC0E4}
.rwx .n{font-family:'Montserrat',sans-serif;font-weight:800;font-size:25px;letter-spacing:-.03em;line-height:1.12;margin-top:3px;white-space:nowrap}
.rwx .m{font-size:12.5px;color:#AFC0E4;margin-top:8px}
.rwb{border-top:1px solid #2A3B66;margin-top:16px;padding-top:12px;font-size:13px;color:#C9D4F0;line-height:1.5}
.rwb b{color:#fff;font-family:'Montserrat',sans-serif;font-weight:700}
.rwb .rwch{margin:0 0 10px}
.lst{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:4px 18px;margin-bottom:16px}
.lst h3{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:14px 0 2px}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border:none;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;color:inherit;font-family:inherit}
.li:last-child{border-bottom:none}
button.li{cursor:pointer}
button.li:active{background:#F8F9FD}

<script>
const URL_='https://hzagwndglwhcepsirafi.supabase.co';
const KEY='sb_publishable_5rAinfDT1K9kwEQnqYwlOA_-C5tk_6h';
const TIER=['','Silver','Gold','Platinum'];
const CATNAME={GARBAGEBAG:'Garbage Bags',CLEARPACK:'Clear Pack',ECOCUP:'Eco Cups',ECOBAG:'Eco Bags',
  ECOSTRAW:'Eco Straws',ECOBOX:'Eco Boxes',FOODSUP:'Food Supplies'};
const $=id=>document.getElementById(id);
let PW='', ME=null, MEM=null, BOARD=[], DETAIL=null, LOADED=0, DEFERRED=null;

const svg=(d,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={
  bag:svg('<path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8a3 3 0 016 0"/>'),
  cash:svg('<rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.5v.01M17.5 14.5v.01"/>'),
  cal:svg('<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8 3v4M16 3v4"/>'),
  trend:svg('<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>'),
  hist:svg('<path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.4"/><path d="M3 4v4h4M12 8v4l3 2"/>'),
  home:svg('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',20),
  bars:svg('<path d="M6 20v-9M12 20V4M18 20v-6"/>',20),
  chev:svg('<path d="M9 6l6 6-6 6"/>',14),
  info:svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>')
};
$('ic-home').innerHTML=IC.home; $('ic-bars').innerHTML=IC.bars;

async function rpc(fn,body){
  const r=await fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error('Could not connect ('+r.status+')');
  return r.json();
}
const jmd=n=>'J$'+Math.round(Number(n||0)).toLocaleString('en-JM');
const jmdM=n=>{const v=Number(n||0);return v>=1e6?'J$'+(v/1e6).toFixed(v>=1e7?1:2)+'M':jmd(v);};
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const ACR=new Set(['MAP','SKD','KFC','DFL','USD']);
const title=s=>String(s||'').split(/(\s+)/).map(w=>ACR.has(w.toUpperCase())?w.toUpperCase():w.toLowerCase().replace(/(^|[(&-])([a-z])/g,(m,a,b)=>a+b.toUpperCase())).join('');
const initials=s=>String(s||'?').replace(/[^A-Za-z0-9 ]/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const catName=c=>CATNAME[String(c).toUpperCase()]||title(c);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function tab(p){document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===p));
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.p===p));}
function togglePw(){const i=$('pw'),b=$('showbtn');const hide=i.type==='password';i.type=hide?'text':'password';b.textContent=hide?'Hide':'Show';}
function showErr(m){$('gateErr').innerHTML='<div class="err">'+esc(m)+'</div>';}

async function enter(){
  const v=$('pw').value.trim();
  if(v.length<6){showErr('Please enter your password.');return;}
  $('gateErr').innerHTML=''; await load(v,false,$('rem').checked);
}
async function load(pw,silent,remember){
  try{
    // A store inside a group has its own password: show that store plus the group total.
    const mem=await rpc('rebate_member_view',{p_code:pw}).catch(()=>null);
    if(mem&&mem.member){
      MEM=mem; ME=mem.group; PW=pw; LOADED=Date.now(); DETAIL=null; BOARD=[];
      if(remember===false) store.del('dfl_rebate_pw'); else store.set('dfl_rebate_pw',pw);
      document.querySelector('.stick').style.display='none'; $('board').innerHTML='';
      $('gate').style.display='none'; $('app').style.display='block';
      tab('store'); renderMember(); return;
    }
    MEM=null; document.querySelector('.stick').style.display='';
    const rows=await rpc('rebate_store_view',{p_code:pw});
    if(!rows.length){
      if(silent){store.del('dfl_rebate_pw');$('gate').style.display='flex';$('app').style.display='none';}
      else showErr('That password was not recognised. Please check with your account manager.');
      return;
    }
    ME=rows[0]; PW=pw; LOADED=Date.now();
    if(remember===false) store.del('dfl_rebate_pw'); else store.set('dfl_rebate_pw',pw);
    const [board,detail]=await Promise.all([
      rpc('rebate_standings_public',{p_code:pw}),
      rpc('rebate_store_detail',{p_code:pw}).catch(()=>null)]);
    BOARD=board; DETAIL=detail;
    $('gate').style.display='none'; $('app').style.display='block';
    renderStore(); renderBoard();
  }catch(e){ if(!silent) showErr(e.message+'. Check your connection and try again.'); }
}
function signOut(){
  store.del('dfl_rebate_pw'); ME=null; MEM=null; PW=''; DETAIL=null; $('pw').value=''; document.querySelector('.stick').style.display='';
  closeCats(); $('app').style.display='none'; $('gate').style.display='flex'; window.scrollTo(0,0);
}
function tiersOf(d){return [1,2,3].filter(n=>Number(d['l'+n+'_target'])>0);}

const tile=(cls,ic,label,num,cap)=>`<div class="tile ${cls}">
  <div class="chip">${IC[ic]}</div><div class="lb">${label}</div><div class="nm">${num}</div><div class="cp">${cap}</div></div>`;

function paceMsg(pt,proj,top){
  if(pt>0) return 'At this pace you reach '+TIER[pt];
  const r=top>0?proj/top:0;
  return r>=0.85?'At this pace you\u2019re close \u2014 finish strong':'At this pace \u2014 every order helps close the gap';
}

function starIc(){return svg('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z"/>',14);}
const payAt=(d,n)=>Math.round(Number(d['l'+n+'_target'])*Number(d['l'+n+'_rate']||0)/100);

const TDOT=['','#B8C0CC','#F0B83A','#EE79A5'];
const RC=2*Math.PI*46;
function ringColor(p){
  const S=[[0,[220,66,89]],[48,[232,167,44]],[88,[46,158,99]]];
  p=Math.max(0,Math.min(100,p));
  for(let i=0;i<S.length-1;i++){const [p0,c0]=S[i],[p1,c1]=S[i+1];
    if(p<=p1){const t=(p-p0)/(p1-p0);return 'rgb('+c0.map((v,k)=>Math.round(v+(c1[k]-v)*t)).join(',')+')';}}
  return 'rgb(46,158,99)';
}
const li=(ic,bg,fg,label,sub,val,tap)=>{
  const t=tap?'button':'div';
  return `<${t} class="li"${tap?' onclick="openCats()"':''}><span class="ic" style="background:${bg};color:${fg}">${IC[ic]}</span>
    <span class="tx"><div class="lb2">${label}</div>${sub?'<div class="sb">'+sub+'</div>':''}</span>
    <span class="vv">${val}</span>${tap?'<span class="chv">'+IC.chev+'</span>':''}</${t}>`;
};

function renderStore(){
  const d=ME, T=tiersOf(d);
  const qs=new Date(d.quarter_start+'T00:00:00'), qe=new Date(d.quarter_end+'T00:00:00');
  const today=new Date(); today.setHours(0,0,0,0);
  const total=(qe-qs)/864e5+1;
  const gone=Math.min(Math.max((today-qs)/864e5+1,0),total);
  const left=Math.max(Math.round((qe-today)/864e5),0);
  const q='Q'+(Math.floor(qs.getMonth()/3)+1)+' '+qs.getFullYear();
  const lvl=d.level_achieved;

  $('hiEye').textContent=greet();
  const bandN=DETAIL&&DETAIL.band?({Silver:1,Gold:2,Platinum:3}[DETAIL.band]||0):0;
  const memberN=bandN||(lvl>0?lvl:(T.length===1?T[0]:0));
  $('hiPill').innerHTML=memberN>0?'<span class="sp sp-'+memberN+'">'+starIc()+TIER[memberN]+' member</span>':'<span class="sp sp-0">Key account member</span>';
  $('hiName').textContent=title(d.customer_name);

  if(!T.length){$('store').innerHTML='<div class="sec"><h2>Your target</h2><div class="sub">Your target is being set up. Your account manager will be in touch.</div></div>';return;}

  const qtd=Number(d.qtd_purchases);
  const topN=T[T.length-1], top=Number(d['l'+topN+'_target']);
  const nextN=T.find(n=>lvl<n);
  const proj=gone>0?qtd/gone*total:0;
  let pt=0; T.forEach(n=>{if(proj>=Number(d['l'+n+'_target'])) pt=n;});
  const pct=Number(d.pct_of_target||0).toFixed(0);
  const weeksLeft=left/7;
  const needWk=(nextN&&weeksLeft>0)?Number(d['gap_to_l'+nextN])/weeksLeft:0;
  const fillPc=Math.min(top>0?qtd/top*100:0,100);
  const prevLabel=DETAIL&&DETAIL.prev_start?(()=>{const a=new Date(DETAIL.prev_start+'T00:00:00'),b=new Date(DETAIL.prev_end+'T00:00:00');
    return MON[a.getMonth()]+' \u2013 '+MON[b.getMonth()];})():'';

  /* hero: ring + what you could earn */
  const rateN=lvl>0?lvl:topN, rate=Number(d['l'+rateN+'_rate']||0);
  const rateTxt=(lvl===0&&T.length>1?'Up to ':'')+rate+'% cash back';
  const hl=lvl===0?(T.length>1?'You could earn up to':'You could earn'):'Your rebate so far';
  const hn=lvl===0?jmd(payAt(d,topN)):jmd(d.rebate_earned);
  const tgtN=nextN||topN, tgtVal=Number(d['l'+tgtN+'_target']);
  const tgtLabel=T.length>1?TIER[tgtN]+' target':'Your target';
  const goLabel=nextN?'Still to go':'Status', goVal=nextN?jmd(d['gap_to_l'+nextN]):'Reached';
  const bottom=lvl>0?(nextN?TIER[nextN]+' would pay <b>'+jmd(payAt(d,nextN))+'</b> at '+jmd(tgtVal)+'.':'Top level reached \u2014 it keeps growing with every purchase.'):'';
  const chips=T.length>1?'<div class="rwch">'+T.map(n=>'<span><i style="background:'+TDOT[n]+'"></i>'+TIER[n]+' '+jmdM(payAt(d,n))+'</span>').join('')+'</div>':'';
  const ticks=T.slice(0,-1).map(n=>{
    const f=Number(d['l'+n+'_target'])/top, ang=f*2*Math.PI-Math.PI/2;
    const x1=56+38*Math.cos(ang), y1=56+38*Math.sin(ang), x2=56+54*Math.cos(ang), y2=56+54*Math.sin(ang);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`;
  }).join('');
  const col=ringColor(fillPc);
  const ringSub=T.length>1?'to '+TIER[topN]:'of target';

  const paceBg=pt>0?'#E3F4EA':'#FCE9E7', paceFg=pt>0?'#217A4B':'#B23A33';

  const sts=(DETAIL&&Array.isArray(DETAIL.stores))?DETAIL.stores:null;
  let storesCard='';
  if(sts&&sts.length>1){
    const withT=sts.filter(s=>Number(s.target)>0).map(s=>({...s,p:Number(s.qtd)/Number(s.target)*100})).sort((a,b)=>a.p-b.p);
    const noT=sts.filter(s=>!(Number(s.target)>0));
    const noTbuy=noT.filter(s=>Number(s.qtd)>0), idle=noT.length-noTbuy.length;
    const av=s=>`<div class="av" style="background:#E6EEFC;color:#2A4FAE">${esc(initials(s.name))}</div>`;
    const pace=s=>{const prj=gone>0?Number(s.qtd)/gone*total:0, k=prj/Number(s.target);
      return k>=1?['On pace','#E3F4EA','#217A4B']:(k>=0.85?['Within reach','#FDF3DC','#8A5A00']:['Behind','#FCE9E7','#B23A33']);};
    storesCard='<div class="lst"><h3>Your stores</h3>'
      +withT.map(s=>{
        const pp=Math.min(s.p,100), st=pace(s);
        return `<div class="r">${av(s)}
          <div class="nm2"><div class="nn">${esc(title(s.name))}</div>
            <div class="nn" style="font-weight:400;font-size:11.5px;color:var(--mute)">${jmdM(s.qtd)} of ${jmdM(s.target)}${s.assumed?' \u00b7 estimated':''}</div>
            <div class="mb"><i style="width:${Math.max(pp,2).toFixed(1)}%;background:${ringColor(pp)}"></i></div></div>
          <span class="pill" style="background:${st[1]};color:${st[2]};width:96px;text-align:center;padding-left:0;padding-right:0">${st[0]}</span>
          <span class="pc" style="min-width:42px;text-align:right">${Math.round(s.p)}%</span></div>`;}).join('')
      +noTbuy.map(s=>`<div class="r">${av(s)}
          <div class="nm2"><div class="nn">${esc(title(s.name))}</div>
            <div class="nn" style="font-weight:400;font-size:11.5px;color:var(--mute)">No separate target this quarter</div></div>
          <span class="pc" style="font-size:13px">${jmdM(s.qtd)}</span></div>`).join('')
      +'<p class="note" style="padding:10px 0 12px">One rebate is paid to the whole group. Each store\u2019s target is its share of the group target.'
      +(sts.some(s=>s.assumed)?' A store without its own budget uses the average of its sister stores.':'')
      +(idle>0?' '+idle+(idle===1?' other store has':' other stores have')+' no target this quarter.':'')+'</p></div>';
  }

  $('store').innerHTML=`
  <div class="rw">
    <div class="rwtop"><span>DFL Rewards</span><span>${q}</span></div>
    <div class="rwmain">
      <div class="ring">
        <svg width="112" height="112" viewBox="0 0 112 112" role="img" aria-label="${Math.round(fillPc)} percent of the way to target">
          <circle cx="56" cy="56" r="46" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="10"/>

/* ---- store login inside a group: own store + group total ---- */
function renderMember(){
  const g=MEM.group, sh=Number(MEM.share), T=tiersOf(g);
  const qs=new Date(g.quarter_start+'T00:00:00'), qe=new Date(g.quarter_end+'T00:00:00');
  const today=new Date(); today.setHours(0,0,0,0);
  const total=(qe-qs)/864e5+1;
  const gone=Math.min(Math.max((today-qs)/864e5+1,0),total);
  const left=Math.max(Math.round((qe-today)/864e5),0);
  const q='Q'+(Math.floor(qs.getMonth()/3)+1)+' '+qs.getFullYear();
  const lvl=g.level_achieved;

  $('hiEye').textContent=greet();
  $('hiPill').innerHTML='<span class="sp sp-0">'+esc(title(g.customer_name))+'</span>';
  $('hiName').textContent=title(MEM.store_name);
  if(!T.length||!(sh>0)){$('store').innerHTML='<div class="sec"><h2>Your target</h2><div class="sub">Your target is being set up. Your account manager will be in touch.</div></div>';return;}

  const mine=n=>Number(g['l'+n+'_target'])*sh;          // this store's share of a level's target
  const topN=T[T.length-1], top=mine(topN);
  const nextN=T.find(n=>lvl<n);
  const qtd=Number(MEM.store_qtd);
  const gq=Number(g.qtd_purchases), gtop=Number(g['l'+topN+'_target']);
  const gproj=gone>0?gq/gone*total:0;
  let pt=0; T.forEach(n=>{if(gproj>=Number(g['l'+n+'_target'])) pt=n;});
  const weeksLeft=left/7;
  const needWk=(nextN&&weeksLeft>0)?Number(g['gap_to_l'+nextN])/weeksLeft:0;
  const fillPc=Math.min(top>0?qtd/top*100:0,100);
  const gPc=Math.min(gtop>0?gq/gtop*100:0,100);
  const sharePc=Math.round(sh*100);

  const rateN=lvl>0?lvl:topN, rate=Number(g['l'+rateN+'_rate']||0);

  const hl=lvl===0?'You could earn up to':'Your share of the rebate so far';
  const hn=lvl===0?jmd(payAt(g,topN)*sh):jmd(MEM.store_rebate);

  const goLabel=nextN?'Group still to go':'Group status', goVal=nextN?jmd(g['gap_to_l'+nextN]):'Reached';
  const col=ringColor(fillPc);

  $('store').innerHTML=`
  <div class="rw">

    <div class="rwmain">
      <div class="ring">
        <svg width="112" height="112" viewBox="0 0 112 112" role="img" aria-label="${Math.round(fillPc)} percent of your store's share of the target">
          <circle cx="56" cy="56" r="46" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="10"/>
          <circle id="rarc" class="rarc" cx="56" cy="56" r="46" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="${RC.toFixed(2)}" stroke-dashoffset="${RC.toFixed(2)}" transform="rotate(-90 56 56)"/>
        </svg>
        <div class="mid"><span class="rn">${Math.round(fillPc)}%</span><span class="rs">your store</span></div>
      </div>
      <div class="rwtx">
        <div class="l">${hl}</div>
        <div class="n">${hn}</div>
        <div class="m"><b>${rateTxt}</b> · ${left} days left</div>
      </div>
    </div>
    <div class="rwst">
      <div><div class="cap">${tgtLabel}</div><div class="v">${jmd(mine(tgtN))}</div></div>
      <span class="dv"></span>
      <div><div class="cap">${goLabel}</div><div class="v">${goVal}</div></div>
    </div>
  </div>
  <div id="inst" class="install"></div>
  <div class="lst">
    <h3>Your store</h3>
    ${li('bag','#E6EEFC','#2A4FAE','Your store’s purchases','This quarter so far',jmdM(qtd))}
    ${li('cash','#E1F2F4','#1F6E7C','Your share of the rebate',sharePc+'% of the group rebate',jmd(MEM.store_rebate))}
  </div>
  <div class="lst">
    <h3>The whole group · ${esc(title(g.customer_name))}</h3>
    ${li('bag','#E6EEFC','#2A4FAE','Group purchases',Math.round(gPc)+'% of the group target',jmdM(gq))}
    ${li('cash','#E1F2F4','#1F6E7C','Group rebate as it stands',nextN?TIER[nextN]+' would pay '+jmd(payAt(g,nextN)):TIER[lvl]+' rate applied',jmd(g.rebate_earned))}
    ${li('cal','#FAEEDA','#854F0B',nextN?'Group needed each week':'Targets reached','',nextN?jmdM(needWk):'✓')}

  </div>
  <details class="acc" open>
    <summary><span class="ic">${IC.info}</span><span class="t">How your share works</span><span class="cv">${IC.chev}</span></summary>
    <div class="bd">
      <p>Your store is part of ${esc(title(g.customer_name))}. One rebate is earned for the whole group, and only when the group reaches its target together.</p>

}

/* ---- where purchases come from ---- */
function openCats(){
  const qs=new Date(ME.quarter_start+'T00:00:00');
  $('shS').textContent='Q'+(Math.floor(qs.getMonth()/3)+1)+' '+qs.getFullYear()+' to date \u00b7 net of returns and credits';
  let h='';
  const cats=DETAIL&&DETAIL.categories?DETAIL.categories:null;
  if(!cats){h='<div class="empty">We couldn\u2019t load this just now. Please try again in a moment.</div>';}
  else if(!cats.length){h='<div class="empty">No purchases recorded yet this quarter.</div>';}
  else{
    const pos=cats.filter(c=>Number(c.amount)>0), neg=cats.filter(c=>Number(c.amount)<0);
    const posTot=pos.reduce((a,c)=>a+Number(c.amount),0)||1;
    const negTot=neg.reduce((a,c)=>a+Number(c.amount),0);
    pos.forEach(c=>{
      const sh=Number(c.amount)/posTot*100;
      h+=`<div class="cat"><div class="ct"><span class="cn">${esc(catName(c.category))}</span><span class="ca">${jmd(c.amount)}</span></div>
        <div class="cb"><i style="width:${Math.max(sh,1.5).toFixed(1)}%"></i></div><div class="cs">${sh.toFixed(0)}% of your purchases</div></div>`;
    });
    if(negTot<0) h+=`<div class="cat neg"><div class="ct"><span class="cn">Credits and adjustments</span><span class="ca">\u2212${jmd(Math.abs(negTot))}</span></div></div>`;
  }
  $('catBody').innerHTML=h;
  $('sheet').classList.add('on'); document.body.classList.add('lock');
}
function closeCats(){$('sheet').classList.remove('on'); document.body.classList.remove('lock');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCats();});

const AVC=[['#E6EEFC','#2A4FAE'],['#E1F2F4','#1F6E7C'],['#FAEEDA','#854F0B'],['#EEEAFB','#5B3BB0'],['#FCE9E7','#B23A33']];
const RKC=['','#C48A0A','#8C97A6','#B5693A'];

  let h='<div class="sec" style="--accent:var(--navy)"><h2>How you rank</h2>'
    +'<div class="yr">You\u2019re ranked <span class="rkc">#'+((BOARD.find(r=>r.is_you)||{}).rank||'\u2014')+'</span> of '+(BOARD.length||'\u2014')+'</div>'
    +'<div class="rows">', seen={};

      <div class="av" style="background:${c[0]};color:${c[1]}">${esc(initials(r.customer_name))}</div>
      <div class="nm2"><div class="nn">${esc(title(r.customer_name))}${r.is_you?'<small>This is you</small>':''}</div>
        <div class="mb"><i style="width:${Math.max(p,2)}%;background:${ringColor(p)}"></i></div></div>
      ${lv>0?'<span class="pill p'+lv+'">'+TIER[lv]+'</span>':''}

/* install as an app */
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;setupInstall();});
function setupInstall(){
  const box=$('inst'); if(!box||standalone()||store.get('dfl_install_dismissed')) return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(DEFERRED){
    box.innerHTML='<div class="t"><b>Keep this on your phone</b><br>Add it as an app for one-tap access.</div>'
      +'<button onclick="doInstall()">Install</button><button class="xx" onclick="dismissInstall()" aria-label="Dismiss">\u00d7</button>';
    box.classList.add('on');
  }else if(ios){
    box.innerHTML='<div class="t"><b>Keep this on your phone</b><br>Tap the Share button, then <b>Add to Home Screen</b>.</div>'
      +'<button class="xx" onclick="dismissInstall()" aria-label="Dismiss">\u00d7</button>';
    box.classList.add('on');
  }
}
async function doInstall(){if(!DEFERRED)return;DEFERRED.prompt();await DEFERRED.userChoice;DEFERRED=null;const b=$('inst');if(b)b.classList.remove('on');}
function dismissInstall(){store.set('dfl_install_dismissed','1');const b=$('inst');if(b)b.classList.remove('on');}


/* trim the tiny slogan from the bottom of the logo image, if one is detected */
function trimLogoData(im){
  try{
    const w=im.naturalWidth,h=im.naturalHeight; if(!w||!h) return null;
    const sc=Math.min(1,700/w), cw=Math.round(w*sc), ch=Math.round(h*sc);
    const c=document.createElement('canvas'); c.width=cw; c.height=ch;
    const x=c.getContext('2d'); x.drawImage(im,0,0,cw,ch);
    const d=x.getImageData(0,0,cw,ch).data;
    const bgA=d[3], bg=[d[0],d[1],d[2]];
    const ink=i=>{const a=d[i+3]; if(bgA<30) return a>40;
      return a>40&&(Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2]))>60;};
    const rows=[]; for(let y=0;y<ch;y++){let f=false;for(let xx=0;xx<cw;xx++){if(ink((y*cw+xx)*4)){f=true;break;}}rows.push(f);}
    const runs=[]; let s=-1;
    rows.forEach((v,y)=>{if(v&&s<0)s=y; if(!v&&s>=0){runs.push([s,y-1]);s=-1;}}); if(s>=0)runs.push([s,ch-1]);
    if(runs.length<2) return null;
    const top=runs[0][0], bottom=runs[runs.length-1][1], total=bottom-top+1;
    const last=runs[runs.length-1];
    if((last[1]-last[0]+1)>total*0.14) return null;
    const cut=runs[runs.length-2][1];
    let minX=cw,maxX=0;
    for(let y=top;y<=cut;y++)for(let xx=0;xx<cw;xx++){if(ink((y*cw+xx)*4)){if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;}}
    if(maxX<=minX) return null;
    const o=document.createElement('canvas'); o.width=maxX-minX+1; o.height=cut-top+1;
    o.getContext('2d').drawImage(c,minX,top,o.width,o.height,0,0,o.width,o.height);
    return o.toDataURL('image/png');
  }catch(e){return null;}
}
function fixLogos(){
  const first=document.querySelector('.logo img'); if(!first) return;
  const im=new Image(); im.crossOrigin='anonymous';
  im.onload=()=>{const data=trimLogoData(im); if(data) document.querySelectorAll('.logo img').forEach(i=>{i.src=data;});};
  im.src=first.src;
}
fixLogos();
